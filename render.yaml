services:
  - type: web
    name: yijingai
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: yijingai-db
          property: connectionString

databases:
  - name: yijingai-db
    databaseName: yijingai
    plan: free
